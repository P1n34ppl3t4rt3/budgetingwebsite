  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f5f6e31e-64c9-4ff6-a0f6-da87b30d96b2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"13442f5b-affe-47a1-bb68-8a328aa9585f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"da024ab8-e102-4431-8de3-f5baa0dfc3fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"55dcc197-5e92-472c-8a08-680298a4f2ba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n  <script src=\"6512dfaa-d979-457d-9e5f-7293c709a89e\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:var(--space-8) clamp(16px, 4vw, var(--space-8)) calc(var(--space-8) * 2);\">\n  <div style=\"max-width:1100px;\">\n\n    <div class=\"nav\" style=\"padding-left:0;padding-right:0;margin-bottom:var(--space-6);flex-wrap:wrap;row-gap:var(--space-3);\">\n      <div class=\"nav-brand\">Our Budget<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap;\" class=\"text-muted\">\n        <span>for<\u002Fspan>\n        <input class=\"input\" type=\"text\" value=\"{{monthLabel}}\" sc-camel-on-change=\"{{onMonthLabelChange}}\" style=\"width:150px;min-height:auto;padding:5px 12px;\">\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;\">\n        <sc-if value=\"{{shareMessage}}\" hint-placeholder-val=\"{{false}}\">\n          <span class=\"tag tag-accent-2\">{{shareMessage}}<\u002Fspan>\n        <\u002Fsc-if>\n        <span class=\"text-muted\" style=\"font-size:12px;\">Saves automatically in this browser<\u002Fspan>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onResetAll}}\">Reset<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onSaveAndNewMonth}}\">Save &amp; start new month<\u002Fbutton>\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{onExportExcel}}\">Export to Excel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card elev-sm\" style=\"padding:var(--space-4) var(--space-6);margin-bottom:var(--space-6);\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;\">\n        <div style=\"flex:1;min-width:220px;\">\n          <div style=\"font-family:var(--font-heading);font-size:15px;margin-bottom:4px;\">Sync with partner<\u002Fdiv>\n          <div class=\"text-muted\" style=\"font-size:12px;\">Get a code and send it to your partner, or paste theirs below to load their numbers.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onGetCode}}\">Get my code<\u002Fbutton>\n          <input class=\"input\" type=\"text\" placeholder=\"Enter partner's code\" value=\"{{joinCodeInput}}\" sc-camel-on-change=\"{{onJoinCodeInputChange}}\" style=\"width:200px;\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{onJoinCode}}\">Load<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{sessionCode}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"margin-top:var(--space-3);\">\n          <textarea readonly=\"{{true}}\" value=\"{{sessionCode}}\" style=\"width:100%;min-height:70px;font-family:monospace;font-size:11px;padding:8px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-200);background:var(--color-bg);resize:vertical;box-sizing:border-box;\"><\u002Ftextarea>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCopyCode}}\" style=\"margin-top:6px;\">Copy code<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-4);margin-bottom:var(--space-6);\">\n      <div class=\"card elev-sm\">\n        <div class=\"card-kicker\">Total Income<\u002Fdiv>\n        <div class=\"card-title\" style=\"font-size:26px;\">{{currencySymbol}}{{totalIncomeDisplay}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\">\n        <div class=\"card-kicker\">Total Expenses<\u002Fdiv>\n        <div class=\"card-title\" style=\"font-size:26px;\">{{currencySymbol}}{{totalExpensesDisplay}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\">\n        <div class=\"card-kicker\">Monthly Savings<\u002Fdiv>\n        <div class=\"card-title\" style=\"font-size:26px;\">{{currencySymbol}}{{totalContributionDisplay}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\">\n        <div class=\"card-kicker\">{{remainingLabel}}<\u002Fdiv>\n        <div class=\"card-title\" style=\"font-size:26px;color:{{remainingColor}};\">{{currencySymbol}}{{remainingDisplay}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\">\n        <div class=\"card-kicker\">Invested<\u002Fdiv>\n        <div class=\"card-title\" style=\"font-size:26px;\">{{currencySymbol}}{{totalInvestedDisplay}}<\u002Fdiv>\n        <div class=\"text-muted\" style=\"font-size:12px;margin-top:2px;color:{{totalGainColor}};\">{{totalGainSign}}{{currencySymbol}}{{totalGainDisplay}} ({{totalGainPctDisplay}}%)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"seg\" style=\"margin-bottom:var(--space-6);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;\">\n      <label class=\"seg-opt\" style=\"flex:1 1 140px;justify-content:center;text-align:center;\"><input type=\"radio\" name=\"mainTab\" value=\"income\" checked=\"{{tabIsIncome}}\" sc-camel-on-change=\"{{onTabChange}}\">Income<\u002Flabel>\n      <label class=\"seg-opt\" style=\"flex:1 1 140px;justify-content:center;text-align:center;\"><input type=\"radio\" name=\"mainTab\" value=\"expenses\" checked=\"{{tabIsExpenses}}\" sc-camel-on-change=\"{{onTabChange}}\">Expenses<\u002Flabel>\n      <sc-if value=\"{{showSavingsGoals}}\" hint-placeholder-val=\"{{true}}\">\n        <label class=\"seg-opt\" style=\"flex:1 1 140px;justify-content:center;text-align:center;\"><input type=\"radio\" name=\"mainTab\" value=\"savings\" checked=\"{{tabIsSavings}}\" sc-camel-on-change=\"{{onTabChange}}\">Savings<\u002Flabel>\n      <\u002Fsc-if>\n      <label class=\"seg-opt\" style=\"flex:1 1 140px;justify-content:center;text-align:center;\"><input type=\"radio\" name=\"mainTab\" value=\"investments\" checked=\"{{tabIsInvestments}}\" sc-camel-on-change=\"{{onTabChange}}\">Investments<\u002Flabel>\n      <label class=\"seg-opt\" style=\"flex:1 1 140px;justify-content:center;text-align:center;\"><input type=\"radio\" name=\"mainTab\" value=\"history\" checked=\"{{tabIsHistory}}\" sc-camel-on-change=\"{{onTabChange}}\">History<\u002Flabel>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{tabIsIncome}}\" hint-placeholder-val=\"{{true}}\">\n    <div class=\"card elev-sm\" style=\"padding:var(--space-6);margin-bottom:var(--space-6);\">\n      <div class=\"card-kicker\">Income<\u002Fdiv>\n      <h3 style=\"margin-bottom:var(--space-1);\">Household income<\u002Fh3>\n      <p class=\"card-body\" style=\"margin-bottom:var(--space-4);flex:none;\">Add every paycheck or income source for each of you.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-6);\">\n        <div>\n          <input class=\"input\" type=\"text\" value=\"{{partnerAName}}\" sc-camel-on-change=\"{{onPartnerANameChange}}\" style=\"display:inline-block;width:auto;max-width:160px;border:none;background:var(--color-accent-100);color:var(--color-accent-700);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700;min-height:auto;\">\n          <sc-for list=\"{{incomeA}}\" as=\"row\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);\">\n              <input class=\"input\" type=\"text\" placeholder=\"Source (e.g. Salary)\" value=\"{{row.source}}\" sc-camel-on-change=\"{{row.onSourceChange}}\" style=\"flex:1;min-width:0;\">\n              <input class=\"input\" type=\"number\" value=\"{{row.amount}}\" sc-camel-on-change=\"{{row.onAmountChange}}\" style=\"width:110px;text-align:right;\">\n              <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{row.onRemove}}\" style=\"font-size:18px;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAddIncomeA}}\" style=\"margin-top:var(--space-3);\">+ Add income<\u002Fbutton>\n          <div style=\"margin-top:var(--space-3);font-family:var(--font-heading);font-size:16px;\">Subtotal {{currencySymbol}}{{totalIncomeADisplay}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <input class=\"input\" type=\"text\" value=\"{{partnerBName}}\" sc-camel-on-change=\"{{onPartnerBNameChange}}\" style=\"display:inline-block;width:auto;max-width:160px;border:none;background:var(--color-accent-2-100);color:var(--color-accent-2-700);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700;min-height:auto;\">\n          <sc-for list=\"{{incomeB}}\" as=\"row\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);\">\n              <input class=\"input\" type=\"text\" placeholder=\"Source (e.g. Salary)\" value=\"{{row.source}}\" sc-camel-on-change=\"{{row.onSourceChange}}\" style=\"flex:1;min-width:0;\">\n              <input class=\"input\" type=\"number\" value=\"{{row.amount}}\" sc-camel-on-change=\"{{row.onAmountChange}}\" style=\"width:110px;text-align:right;\">\n              <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{row.onRemove}}\" style=\"font-size:18px;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAddIncomeB}}\" style=\"margin-top:var(--space-3);\">+ Add income<\u002Fbutton>\n          <div style=\"margin-top:var(--space-3);font-family:var(--font-heading);font-size:16px;\">Subtotal {{currencySymbol}}{{totalIncomeBDisplay}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:var(--space-6);padding-top:var(--space-6);border-top:1px solid var(--color-divider);\">\n        <h4 style=\"margin-bottom:var(--space-1);\">One-time income<\u002Fh4>\n        <p class=\"card-body\" style=\"margin-bottom:var(--space-3);flex:none;\">Extra income that won't repeat next month — like selling a secondhand item. Still counted in this month's totals.<\u002Fp>\n        <sc-for list=\"{{oneTimeIncome}}\" as=\"row\" hint-placeholder-count=\"1\">\n          <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:var(--space-2);\">\n            <input class=\"input\" type=\"text\" placeholder=\"What did you sell?\" value=\"{{row.description}}\" sc-camel-on-change=\"{{row.onDescriptionChange}}\" style=\"flex:2;min-width:140px;\">\n            <input class=\"input\" type=\"number\" value=\"{{row.amount}}\" sc-camel-on-change=\"{{row.onAmountChange}}\" style=\"width:100px;flex:none;text-align:right;\">\n            <sc-raw-select class=\"input\" value=\"{{row.partner}}\" sc-camel-on-change=\"{{row.onPartnerChange}}\" style=\"width:120px;flex:none;\">\n              <option value=\"A\">{{partnerAName}}<\u002Foption>\n              <option value=\"B\">{{partnerBName}}<\u002Foption>\n            <\u002Fsc-raw-select>\n            <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{row.onRemove}}\" style=\"font-size:18px;flex:none;\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAddOneTimeIncome}}\" style=\"margin-top:var(--space-3);\">+ Add one-time income<\u002Fbutton>\n        <div style=\"margin-top:var(--space-3);font-family:var(--font-heading);font-size:16px;\">Total one-time this month: {{currencySymbol}}{{totalOneTimeDisplay}}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tabIsExpenses}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"card elev-sm\" style=\"padding:var(--space-6);margin-bottom:var(--space-6);\">\n      <div class=\"card-kicker\">Expenses<\u002Fdiv>\n      <h3 style=\"margin-bottom:var(--space-1);\">Where it goes<\u002Fh3>\n      <p class=\"card-body\" style=\"margin-bottom:var(--space-4);flex:none;\">We started you off with a few common ones — edit, remove, or add your own.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;\">\n        <sc-for list=\"{{expenseRows}}\" as=\"row\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:var(--space-3) 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\">\n            <input class=\"input\" type=\"text\" value=\"{{row.category}}\" sc-camel-on-change=\"{{row.onCategoryChange}}\" placeholder=\"Category\" style=\"flex:2;min-width:140px;border:none;background:transparent;padding:2px 4px;min-height:auto;font-family:var(--font-heading);font-size:15px;\">\n            <sc-raw-select class=\"input\" value=\"{{row.frequency}}\" sc-camel-on-change=\"{{row.onFrequencyChange}}\" style=\"min-height:auto;padding:5px 10px;font-size:13px;flex:none;width:110px;\">\n              <option value=\"monthly\">Monthly<\u002Foption>\n              <option value=\"weekly\">Weekly<\u002Foption>\n            <\u002Fsc-raw-select>\n            <input class=\"input\" type=\"number\" value=\"{{row.amount}}\" sc-camel-on-change=\"{{row.onAmountChange}}\" style=\"min-height:auto;padding:5px 10px;width:90px;flex:none;\">\n            <div style=\"display:flex;gap:12px;font-size:13px;flex:1;min-width:160px;justify-content:flex-end;\">\n              <span class=\"text-muted\">Spent {{currencySymbol}}{{row.spentDisplay}}<\u002Fspan>\n              <span style=\"font-weight:700;color:{{row.leftColor}};\">Left {{currencySymbol}}{{row.leftDisplay}}<\u002Fspan>\n            <\u002Fdiv>\n            <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{row.onRemove}}\" style=\"font-size:18px;width:28px;height:28px;flex:none;\">×<\u002Fbutton>\n            <div class=\"text-muted\" style=\"font-size:11px;width:100%;\">{{partnerAInitial}} {{currencySymbol}}{{row.shareADisplay}} · {{partnerBInitial}} {{currencySymbol}}{{row.shareBDisplay}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAddExpense}}\" style=\"margin-top:var(--space-4);\">+ Add category<\u002Fbutton>\n      <div class=\"text-muted\" style=\"font-size:12px;margin-top:var(--space-3);\">Weekly categories track \"Left\" against their weekly budget; monthly categories track it against the monthly amount. Weekly budgets are still × 4.33 in the totals above.<\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-3);font-family:var(--font-heading);font-size:18px;\">\n        <span>Total monthly expenses<\u002Fspan><span>{{currencySymbol}}{{totalExpensesDisplay}}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:var(--space-6);padding-top:var(--space-6);border-top:1px solid var(--color-divider);\">\n        <h4 style=\"margin-bottom:var(--space-1);\">Log an expense<\u002Fh4>\n        <p class=\"card-body\" style=\"margin-bottom:var(--space-3);flex:none;\">Record a purchase against a category and we'll subtract it from what's left to spend.<\u002Fp>\n        <div style=\"display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:flex-end;row-gap:var(--space-3);\">\n          <div class=\"field\" style=\"flex:1;min-width:160px;margin:0;\">\n            <label>Category<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{logForm.categoryId}}\" sc-camel-on-change=\"{{onLogCategoryChange}}\">\n              <option value=\"\">Choose category…<\u002Foption>\n              <sc-for list=\"{{categoryOptions}}\" as=\"opt\" hint-placeholder-count=\"3\">\n                <option value=\"{{opt.id}}\">{{opt.category}}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"flex:2;min-width:180px;margin:0;\">\n            <label>What was it?<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"e.g. Trader Joe's\" value=\"{{logForm.description}}\" sc-camel-on-change=\"{{onLogDescriptionChange}}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"width:120px;margin:0;\">\n            <label>Amount<\u002Flabel>\n            <input class=\"input\" type=\"number\" placeholder=\"0\" value=\"{{logForm.amount}}\" sc-camel-on-change=\"{{onLogAmountChange}}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:flex-end;margin-top:var(--space-3);\">\n          <div>\n            <label style=\"display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Paid by<\u002Flabel>\n            <div class=\"seg\">\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"logPaidBy\" value=\"A\" checked=\"{{logForm.paidByIsA}}\" sc-camel-on-change=\"{{onPaidByChange}}\">{{partnerAName}}<\u002Flabel>\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"logPaidBy\" value=\"B\" checked=\"{{logForm.paidByIsB}}\" sc-camel-on-change=\"{{onPaidByChange}}\">{{partnerBName}}<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Split?<\u002Flabel>\n            <div class=\"seg\">\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"logSplit\" value=\"split\" checked=\"{{logForm.splitIsSplit}}\" sc-camel-on-change=\"{{onSplitChange}}\">Split<\u002Flabel>\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"logSplit\" value=\"solo\" checked=\"{{logForm.splitIsSolo}}\" sc-camel-on-change=\"{{onSplitChange}}\">One of us covers it<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{onLogSubmit}}\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{hasLogEntries}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"margin-top:var(--space-4);\">\n            <sc-for list=\"{{logEntries}}\" as=\"entry\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;flex-direction:column;gap:4px;padding:var(--space-2) 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\">\n                <div style=\"display:flex;align-items:center;gap:var(--space-3);font-size:14px;\">\n                  <span class=\"tag tag-neutral\">{{entry.categoryName}}<\u002Fspan>\n                  <span class=\"tag {{entry.paidByTagClass}}\">{{entry.paidByLabel}}<\u002Fspan>\n                  <span style=\"flex:1;\">{{entry.description}}<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading);\">{{currencySymbol}}{{entry.amountDisplay}}<\u002Fspan>\n                  <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{entry.onRemove}}\" style=\"font-size:18px;width:28px;height:28px;\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:11px;padding-left:2px;\">{{entry.splitText}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showSavingsGoals}}\" hint-placeholder-val=\"{{true}}\">\n    <sc-if value=\"{{tabIsSavings}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card elev-sm\" style=\"padding:var(--space-6);\">\n        <div class=\"card-kicker\">Savings Goals<\u002Fdiv>\n        <h3 style=\"margin-bottom:var(--space-1);\">What we're saving for<\u002Fh3>\n        <p class=\"card-body\" style=\"margin-bottom:var(--space-4);flex:none;\">Track progress on what you're saving for together.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-4);\">\n          <sc-for list=\"{{savingsRows}}\" as=\"goal\" hint-placeholder-count=\"2\">\n            <div class=\"card\" style=\"background:var(--color-bg);box-shadow:var(--shadow-sm);\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2);\">\n                <input class=\"input\" type=\"text\" value=\"{{goal.name}}\" sc-camel-on-change=\"{{goal.onNameChange}}\" placeholder=\"Goal name\" style=\"border:none;background:transparent;padding:0;min-height:auto;font-family:var(--font-heading);font-size:16px;flex:1;min-width:0;\">\n                <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{goal.onRemove}}\" style=\"font-size:18px;width:28px;height:28px;\">×<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"height:8px;background:var(--color-neutral-200);border-radius:999px;overflow:hidden;margin:var(--space-3) 0 var(--space-2);\">\n                <div style=\"{{goal.barStyle}}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;\" class=\"text-muted\">\n                <span>{{currencySymbol}}{{goal.saved}} saved<\u002Fspan><span>{{goal.pctDisplay}}% of {{currencySymbol}}{{goal.target}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:var(--space-3);margin-top:var(--space-3);\">\n                <div class=\"field\" style=\"flex:1;margin:0;\"><label>Target<\u002Flabel><input class=\"input\" type=\"number\" value=\"{{goal.target}}\" sc-camel-on-change=\"{{goal.onTargetChange}}\"><\u002Fdiv>\n                <div class=\"field\" style=\"flex:1;margin:0;\"><label>Saved<\u002Flabel><input class=\"input\" type=\"number\" value=\"{{goal.saved}}\" sc-camel-on-change=\"{{goal.onSavedChange}}\"><\u002Fdiv>\n                <div class=\"field\" style=\"flex:1;margin:0;\"><label>Monthly<\u002Flabel><input class=\"input\" type=\"number\" value=\"{{goal.contribution}}\" sc-camel-on-change=\"{{goal.onContributionChange}}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAddSavings}}\" style=\"margin-top:var(--space-4);\">+ Add goal<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tabIsInvestments}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card elev-sm\" style=\"padding:var(--space-6);\">\n        <div class=\"card-kicker\">Investments<\u002Fdiv>\n        <h3 style=\"margin-bottom:var(--space-1);\">Putting savings to work<\u002Fh3>\n        <p class=\"card-body\" style=\"margin-bottom:var(--space-4);flex:none;\">Track what you've moved from savings into investments and how it's doing.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;\">\n          <sc-for list=\"{{investmentRows}}\" as=\"inv\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:var(--space-3) 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\">\n              <input class=\"input\" type=\"text\" value=\"{{inv.name}}\" sc-camel-on-change=\"{{inv.onNameChange}}\" placeholder=\"e.g. Index fund\" style=\"flex:2;min-width:140px;border:none;background:transparent;padding:2px 4px;min-height:auto;font-family:var(--font-heading);font-size:15px;\">\n              <div class=\"field\" style=\"margin:0;flex:none;\">\n                <label style=\"font-size:11px;\">Invested<\u002Flabel>\n                <input class=\"input\" type=\"number\" value=\"{{inv.invested}}\" sc-camel-on-change=\"{{inv.onInvestedChange}}\" style=\"min-height:auto;padding:5px 10px;width:100px;\">\n              <\u002Fdiv>\n              <div class=\"field\" style=\"margin:0;flex:none;\">\n                <label style=\"font-size:11px;\">Current value<\u002Flabel>\n                <input class=\"input\" type=\"number\" value=\"{{inv.currentValue}}\" sc-camel-on-change=\"{{inv.onCurrentValueChange}}\" style=\"min-height:auto;padding:5px 10px;width:100px;\">\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:140px;text-align:right;font-size:13px;font-weight:700;color:{{inv.gainColor}};\">{{inv.gainSign}}{{currencySymbol}}{{inv.gainDisplay}} ({{inv.gainPctDisplay}}%)<\u002Fdiv>\n              <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{inv.onRemove}}\" style=\"font-size:18px;width:28px;height:28px;flex:none;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAddInvestment}}\" style=\"margin-top:var(--space-4);\">+ Add investment<\u002Fbutton>\n        <div style=\"display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-3);font-family:var(--font-heading);font-size:18px;\">\n          <span>Total invested<\u002Fspan><span>{{currencySymbol}}{{totalInvestedDisplay}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tabIsHistory}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card elev-sm\" style=\"padding:var(--space-6);\">\n        <div class=\"card-kicker\">History<\u002Fdiv>\n        <h3 style=\"margin-bottom:var(--space-1);\">Past months<\u002Fh3>\n        <p class=\"card-body\" style=\"margin-bottom:var(--space-4);flex:none;\">Months you've saved before starting a new one. Load one back in to review or pick up where you left off.<\u002Fp>\n        <sc-if value=\"{{hasSavedMonths}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display:flex;flex-direction:column;\">\n            <sc-for list=\"{{savedMonths}}\" as=\"entry\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:var(--space-3) 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\">\n                <div style=\"flex:2;min-width:140px;\">\n                  <div style=\"font-family:var(--font-heading);font-size:15px;\">{{entry.label}}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:11px;\">Saved {{entry.savedAtDisplay}}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;flex:1;min-width:180px;\">Income {{currencySymbol}}{{entry.totalIncomeDisplay}} · Expenses {{currencySymbol}}{{entry.totalExpensesDisplay}}<\u002Fdiv>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{entry.onLoad}}\">Load<\u002Fbutton>\n                <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{entry.onDelete}}\" style=\"font-size:18px;width:28px;height:28px;\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{hasNoSavedMonths}}\" hint-placeholder-val=\"{{true}}\">\n          <p class=\"text-muted\">No saved months yet — use \"Save &amp; start new month\" up top when you're ready to close out this month.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;splitMethod&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;proportional&quot;, &quot;options&quot;: [&quot;proportional&quot;, &quot;fifty-fifty&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behavior&quot;},\n  &quot;currencySymbol&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;$&quot;, &quot;options&quot;: [&quot;$&quot;, &quot;€&quot;, &quot;£&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behavior&quot;},\n  &quot;showSavingsGoals&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}\n}\">\nconst BUDGET_STORAGE_KEY = 'couplesBudgetTracker_v1';\n\nclass Component extends DCLogic {\n  componentDidMount() {\n    try {\n      const saved = localStorage.getItem(BUDGET_STORAGE_KEY);\n      if (saved) this.setState(JSON.parse(saved));\n    } catch (e) { /* ignore corrupt/missing data */ }\n  }\n\n  snapshotPayload() {\n    const { monthLabel, incomeRows, oneTimeIncome, expenseRows, savingsRows, investmentRows, expenseLog, partnerAName, partnerBName } = this.state;\n    return { monthLabel, incomeRows, oneTimeIncome, expenseRows, savingsRows, investmentRows, expenseLog, partnerAName, partnerBName };\n  }\n\n  flashMessage(msg) {\n    this.setState({ shareMessage: msg });\n    setTimeout(() => this.setState({ shareMessage: '' }), 4000);\n  }\n\n  getSessionCode = () => {\n    const code = btoa(JSON.stringify(this.snapshotPayload()));\n    this.setState({ sessionCode: code });\n  };\n\n  copyCode = () => {\n    const code = this.state.sessionCode;\n    if (!code) return;\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(code).then(() => this.flashMessage('Code copied — send it to your partner')).catch(() => window.prompt('Copy this code:', code));\n    } else {\n      window.prompt('Copy this code:', code);\n    }\n  };\n\n  onJoinCodeInputChange = (e) => this.setState({ joinCodeInput: e.target.value });\n\n  joinCode = () => {\n    try {\n      const shared = JSON.parse(atob(this.state.joinCodeInput.trim()));\n      this.setState({ ...shared, joinCodeInput: '', activeTab: 'income' });\n      this.flashMessage(\"Loaded your partner's budget\");\n    } catch (e) {\n      this.flashMessage('That code looks invalid — check you copied all of it');\n    }\n  };\n\n  componentDidUpdate() {\n    try {\n      const { monthLabel, incomeRows, oneTimeIncome, expenseRows, savingsRows, investmentRows, expenseLog, partnerAName, partnerBName, savedMonths } = this.state;\n      localStorage.setItem(BUDGET_STORAGE_KEY, JSON.stringify({ monthLabel, incomeRows, oneTimeIncome, expenseRows, savingsRows, investmentRows, expenseLog, partnerAName, partnerBName, savedMonths }));\n    } catch (e) { /* storage unavailable */ }\n  }\n\n  saveAndStartNewMonth = () => {\n    const s = this.state;\n    const snapshot = {\n      monthLabel: s.monthLabel, incomeRows: s.incomeRows, oneTimeIncome: s.oneTimeIncome,\n      expenseRows: s.expenseRows, savingsRows: s.savingsRows, investmentRows: s.investmentRows, expenseLog: s.expenseLog,\n    };\n    const totalIncome = s.incomeRows.reduce((a, r) => a + r.amount, 0) + s.oneTimeIncome.reduce((a, r) => a + r.amount, 0);\n    const totalExpenses = s.expenseRows.reduce((a, r) => a + (r.frequency === 'weekly' ? r.amount * 4.33 : r.amount), 0);\n    const entry = { id: this.genId(), label: s.monthLabel || 'Untitled month', savedAt: new Date().toISOString(), snapshot, totalIncome, totalExpenses };\n    const nextLabel = window.prompt('Name for the new month?', '') || '';\n    this.setState(prev => ({\n      savedMonths: [entry, ...prev.savedMonths],\n      monthLabel: nextLabel,\n      oneTimeIncome: [],\n      expenseLog: [],\n      activeTab: 'income',\n    }));\n  };\n\n  loadSavedMonth = (id) => {\n    const entry = this.state.savedMonths.find(m => m.id === id);\n    if (!entry) return;\n    if (!window.confirm(`Load \"${entry.label}\"? This replaces your current working budget (still saved in History).`)) return;\n    this.setState({ ...entry.snapshot, activeTab: 'income' });\n  };\n\n  deleteSavedMonth = (id) => {\n    if (!window.confirm('Delete this saved month?')) return;\n    this.setState(prev => ({ savedMonths: prev.savedMonths.filter(m => m.id !== id) }));\n  };\n\n  resetAll = () => {\n    if (!window.confirm('Reset to the example budget? This clears everything saved in this browser.')) return;\n    try { localStorage.removeItem(BUDGET_STORAGE_KEY); } catch (e) {}\n    this.setState({ ...this.defaultState(), activeTab: this.state.activeTab });\n  };\n\n  defaultState() {\n    return {\n    monthLabel: 'August 2026',\n    incomeRows: [\n      { id: 1, partner: 'A', source: 'Salary', amount: 4200 },\n      { id: 2, partner: 'B', source: 'Salary', amount: 3800 },\n    ],\n    oneTimeIncome: [\n      { id: 1, description: 'Sold couch', amount: 150, partner: 'A' },\n    ],\n    expenseRows: [\n      { id: 1, category: 'Rent / Mortgage', amount: 1800, frequency: 'monthly' },\n      { id: 2, category: 'Groceries', amount: 600, frequency: 'monthly' },\n      { id: 3, category: 'Utilities', amount: 220, frequency: 'monthly' },\n      { id: 4, category: 'Transportation', amount: 250, frequency: 'monthly' },\n      { id: 5, category: 'Insurance', amount: 180, frequency: 'monthly' },\n      { id: 6, category: 'Subscriptions', amount: 60, frequency: 'monthly' },\n      { id: 7, category: 'Travel Fund', amount: 150, frequency: 'monthly' },\n      { id: 8, category: 'Date Night Fund', amount: 100, frequency: 'monthly' },\n      { id: 9, category: 'Outdoor Fund', amount: 40, frequency: 'weekly' },\n    ],\n    savingsRows: [\n      { id: 1, name: 'Emergency Fund', target: 10000, saved: 3200, contribution: 200 },\n      { id: 2, name: 'Vacation', target: 3000, saved: 450, contribution: 150 },\n    ],\n    investmentRows: [\n      { id: 1, name: 'Index Fund', invested: 2000, currentValue: 2150 },\n    ],\n    expenseLog: [\n      { id: 201, categoryId: 2, description: \"Trader Joe's\", amount: 85, paidBy: 'A', splitRequired: true },\n      { id: 202, categoryId: 7, description: 'Flight deposit', amount: 120, paidBy: 'B', splitRequired: false },\n    ],\n      logForm: { categoryId: '', description: '', amount: '', paidBy: 'A', splitRequired: true },\n    };\n  }\n\n  state = { ...this.defaultState(), activeTab: 'income', partnerAName: 'Partner A', partnerBName: 'Partner B', savedMonths: [], sessionCode: '', joinCodeInput: '' };\n  idCounter = 100;\n  onTabChange = (e) => this.setState({ activeTab: e.target.value });\n  onPartnerANameChange = (e) => this.setState({ partnerAName: e.target.value });\n  onPartnerBNameChange = (e) => this.setState({ partnerBName: e.target.value });\n  genId() { return ++this.idCounter; }\n\n  updateMonthLabel = (e) => this.setState({ monthLabel: e.target.value });\n\n  addIncome = (partner) => this.setState(s => ({ incomeRows: [...s.incomeRows, { id: this.genId(), partner, source: '', amount: 0 }] }));\n  updateIncomeField = (id, field, value) => this.setState(s => ({\n    incomeRows: s.incomeRows.map(r => r.id === id ? { ...r, [field]: field === 'amount' ? (parseFloat(value) || 0) : value } : r)\n  }));\n  removeIncome = (id) => this.setState(s => ({ incomeRows: s.incomeRows.filter(r => r.id !== id) }));\n\n  addOneTimeIncome = () => this.setState(s => ({ oneTimeIncome: [...s.oneTimeIncome, { id: this.genId(), description: '', amount: 0, partner: 'A' }] }));\n  updateOneTimeField = (id, field, value) => this.setState(s => ({\n    oneTimeIncome: s.oneTimeIncome.map(r => r.id === id ? { ...r, [field]: field === 'amount' ? (parseFloat(value) || 0) : value } : r)\n  }));\n  removeOneTimeIncome = (id) => this.setState(s => ({ oneTimeIncome: s.oneTimeIncome.filter(r => r.id !== id) }));\n\n  addExpense = () => this.setState(s => ({ expenseRows: [...s.expenseRows, { id: this.genId(), category: '', amount: 0, frequency: 'monthly' }] }));\n  updateExpenseField = (id, field, value) => this.setState(s => ({\n    expenseRows: s.expenseRows.map(r => r.id === id ? { ...r, [field]: field === 'amount' ? (parseFloat(value) || 0) : value } : r)\n  }));\n  removeExpense = (id) => this.setState(s => ({ expenseRows: s.expenseRows.filter(r => r.id !== id) }));\n\n  addSavings = () => this.setState(s => ({ savingsRows: [...s.savingsRows, { id: this.genId(), name: '', target: 0, saved: 0, contribution: 0 }] }));\n  updateSavingsField = (id, field, value) => this.setState(s => ({\n    savingsRows: s.savingsRows.map(r => r.id === id ? { ...r, [field]: field === 'name' ? value : (parseFloat(value) || 0) } : r)\n  }));\n  removeSavings = (id) => this.setState(s => ({ savingsRows: s.savingsRows.filter(r => r.id !== id) }));\n\n  addInvestment = () => this.setState(s => ({ investmentRows: [...s.investmentRows, { id: this.genId(), name: '', invested: 0, currentValue: 0 }] }));\n  updateInvestmentField = (id, field, value) => this.setState(s => ({\n    investmentRows: s.investmentRows.map(r => r.id === id ? { ...r, [field]: field === 'name' ? value : (parseFloat(value) || 0) } : r)\n  }));\n  removeInvestment = (id) => this.setState(s => ({ investmentRows: s.investmentRows.filter(r => r.id !== id) }));\n\n  onLogCategoryChange = (e) => this.setState(s => ({ logForm: { ...s.logForm, categoryId: e.target.value } }));\n  onLogDescriptionChange = (e) => this.setState(s => ({ logForm: { ...s.logForm, description: e.target.value } }));\n  onLogAmountChange = (e) => this.setState(s => ({ logForm: { ...s.logForm, amount: e.target.value } }));\n  onPaidByChange = (e) => this.setState(s => ({ logForm: { ...s.logForm, paidBy: e.target.value } }));\n  onSplitChange = (e) => this.setState(s => ({ logForm: { ...s.logForm, splitRequired: e.target.value === 'split' } }));\n  onLogSubmit = () => {\n    const { categoryId, description, amount, paidBy, splitRequired } = this.state.logForm;\n    const amt = parseFloat(amount);\n    if (!categoryId || !amt || amt <= 0) return;\n    this.setState(s => ({\n      expenseLog: [...s.expenseLog, {\n        id: this.genId(), categoryId: parseInt(categoryId, 10), description: description || 'Expense',\n        amount: amt, paidBy, splitRequired,\n      }],\n      logForm: { categoryId: '', description: '', amount: '', paidBy: 'A', splitRequired: true },\n    }));\n  };\n  removeLogEntry = (id) => this.setState(s => ({ expenseLog: s.expenseLog.filter(e => e.id !== id) }));\n\n  decorateIncome(r) {\n    return {\n      ...r,\n      onSourceChange: (e) => this.updateIncomeField(r.id, 'source', e.target.value),\n      onAmountChange: (e) => this.updateIncomeField(r.id, 'amount', e.target.value),\n      onRemove: () => this.removeIncome(r.id),\n    };\n  }\n\n  loadXLSX() {\n    if (window.XLSX) return Promise.resolve(window.XLSX);\n    if (this._xlsxPromise) return this._xlsxPromise;\n    this._xlsxPromise = new Promise((resolve, reject) => {\n      const el = document.createElement('script');\n      el.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';\n      el.onload = () => resolve(window.XLSX);\n      el.onerror = reject;\n      document.head.appendChild(el);\n    });\n    return this._xlsxPromise;\n  }\n\n  exportExcel = async () => {\n    const XLSX = await this.loadXLSX().catch(() => null);\n    if (!XLSX) return;\n    const s = this.state;\n    const incomeSheet = [\n      ...s.incomeRows.map(r => ({ Partner: r.partner === 'A' ? s.partnerAName : s.partnerBName, Source: r.source, Type: 'Recurring', Amount: r.amount })),\n      ...s.oneTimeIncome.map(r => ({ Partner: r.partner === 'A' ? s.partnerAName : s.partnerBName, Source: r.description, Type: 'One-time', Amount: r.amount })),\n    ];\n    const expenseSheet = s.expenseRows.map(r => ({\n      Category: r.category, Frequency: r.frequency, Amount: r.amount,\n      'Monthly Equivalent': +((r.frequency === 'weekly' ? r.amount * 4.33 : r.amount).toFixed(2)),\n    }));\n    const savingsSheet = s.savingsRows.map(r => ({ Goal: r.name, Target: r.target, Saved: r.saved, 'Monthly Contribution': r.contribution }));\n    const investmentSheet = s.investmentRows.map(r => ({ Investment: r.name, Invested: r.invested, 'Current Value': r.currentValue, Gain: +(r.currentValue - r.invested).toFixed(2) }));\n    const totalIncome = s.incomeRows.reduce((a, r) => a + r.amount, 0) + s.oneTimeIncome.reduce((a, r) => a + r.amount, 0);\n    const totalExpenses = expenseSheet.reduce((a, r) => a + r['Monthly Equivalent'], 0);\n    const totalContribution = s.savingsRows.reduce((a, r) => a + r.contribution, 0);\n    const summarySheet = [\n      { Metric: 'Total Income', Value: totalIncome },\n      { Metric: 'Total Expenses', Value: totalExpenses },\n      { Metric: 'Total Monthly Savings', Value: totalContribution },\n      { Metric: 'Remaining', Value: +(totalIncome - totalExpenses - totalContribution).toFixed(2) },\n    ];\n    const wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(incomeSheet), 'Income');\n    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseSheet), 'Expenses');\n    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(savingsSheet), 'Savings Goals');\n    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(investmentSheet), 'Investments');\n    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summarySheet), 'Summary');\n    XLSX.writeFile(wb, (s.monthLabel || 'Budget').replace(/\\s+/g, '_') + '_Budget.xlsx');\n  };\n\n  renderVals() {\n    const s = this.state;\n    const currencySymbol = this.props.currencySymbol ?? '$';\n    const splitMethod = this.props.splitMethod ?? 'proportional';\n    const showSavingsGoals = this.props.showSavingsGoals ?? true;\n\n    const incomeA = s.incomeRows.filter(r => r.partner === 'A').map(r => this.decorateIncome(r));\n    const incomeB = s.incomeRows.filter(r => r.partner === 'B').map(r => this.decorateIncome(r));\n    const oneTimeIncome = s.oneTimeIncome.map(r => ({\n      ...r,\n      onDescriptionChange: (e) => this.updateOneTimeField(r.id, 'description', e.target.value),\n      onAmountChange: (e) => this.updateOneTimeField(r.id, 'amount', e.target.value),\n      onPartnerChange: (e) => this.updateOneTimeField(r.id, 'partner', e.target.value),\n      onRemove: () => this.removeOneTimeIncome(r.id),\n    }));\n    const oneTimeA = oneTimeIncome.filter(r => r.partner === 'A').reduce((a, r) => a + r.amount, 0);\n    const oneTimeB = oneTimeIncome.filter(r => r.partner === 'B').reduce((a, r) => a + r.amount, 0);\n    const totalOneTime = oneTimeA + oneTimeB;\n    const totalIncomeA = incomeA.reduce((a, r) => a + r.amount, 0) + oneTimeA;\n    const totalIncomeB = incomeB.reduce((a, r) => a + r.amount, 0) + oneTimeB;\n    const totalIncome = totalIncomeA + totalIncomeB;\n\n    const spentByCategory = {};\n    s.expenseLog.forEach(entry => {\n      spentByCategory[entry.categoryId] = (spentByCategory[entry.categoryId] || 0) + entry.amount;\n    });\n\n    const expenseRows = s.expenseRows.map(r => {\n      const monthlyAmount = r.frequency === 'weekly' ? r.amount * 4.33 : r.amount;\n      let shareA;\n      if (splitMethod === 'fifty-fifty') {\n        shareA = monthlyAmount / 2;\n      } else {\n        shareA = totalIncome > 0 ? monthlyAmount * (totalIncomeA / totalIncome) : monthlyAmount / 2;\n      }\n      const shareB = monthlyAmount - shareA;\n      const spent = spentByCategory[r.id] || 0;\n      const left = r.amount - spent;\n      return {\n        ...r,\n        monthlyAmount,\n        shareADisplay: shareA.toFixed(2),\n        shareBDisplay: shareB.toFixed(2),\n        spentDisplay: spent.toFixed(2),\n        leftDisplay: left.toFixed(2),\n        leftColor: left >= 0 ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)',\n        onCategoryChange: (e) => this.updateExpenseField(r.id, 'category', e.target.value),\n        onAmountChange: (e) => this.updateExpenseField(r.id, 'amount', e.target.value),\n        onFrequencyChange: (e) => this.updateExpenseField(r.id, 'frequency', e.target.value),\n        onRemove: () => this.removeExpense(r.id),\n      };\n    });\n    const totalExpenses = expenseRows.reduce((a, r) => a + r.monthlyAmount, 0);\n\n    const categoryOptions = s.expenseRows.map(r => ({ id: r.id, category: r.category || 'Untitled category' }));\n    const logEntries = [...s.expenseLog].reverse().map(entry => {\n      const cat = s.expenseRows.find(r => r.id === entry.categoryId);\n      const paidByLabel = entry.paidBy === 'B' ? s.partnerBName : s.partnerAName;\n      let splitText;\n      if (entry.splitRequired) {\n        let shareA = splitMethod === 'fifty-fifty'\n          ? entry.amount / 2\n          : (totalIncome > 0 ? entry.amount * (totalIncomeA / totalIncome) : entry.amount / 2);\n        const shareB = entry.amount - shareA;\n        splitText = `Split — ${s.partnerAName} ${currencySymbol}${shareA.toFixed(2)} · ${s.partnerBName} ${currencySymbol}${shareB.toFixed(2)}`;\n      } else {\n        splitText = `${paidByLabel} covers it, no split`;\n      }\n      return {\n        ...entry,\n        categoryName: cat ? (cat.category || 'Untitled category') : 'Deleted category',\n        amountDisplay: entry.amount.toFixed(2),\n        paidByLabel,\n        paidByTagClass: entry.paidBy === 'B' ? 'tag-accent-2' : 'tag-accent',\n        splitText,\n        onRemove: () => this.removeLogEntry(entry.id),\n      };\n    });\n\n    const savingsRows = s.savingsRows.map(r => {\n      const pct = r.target > 0 ? Math.min(100, (r.saved / r.target) * 100) : 0;\n      return {\n        ...r,\n        pctDisplay: pct.toFixed(0),\n        barStyle: { width: pct + '%', height: '100%', background: 'var(--color-accent-2)', borderRadius: '999px' },\n        onNameChange: (e) => this.updateSavingsField(r.id, 'name', e.target.value),\n        onTargetChange: (e) => this.updateSavingsField(r.id, 'target', e.target.value),\n        onSavedChange: (e) => this.updateSavingsField(r.id, 'saved', e.target.value),\n        onContributionChange: (e) => this.updateSavingsField(r.id, 'contribution', e.target.value),\n        onRemove: () => this.removeSavings(r.id),\n      };\n    });\n    const totalContribution = savingsRows.reduce((a, r) => a + r.contribution, 0);\n    const remaining = totalIncome - totalExpenses - totalContribution;\n\n    const investmentRows = s.investmentRows.map(r => {\n      const gain = r.currentValue - r.invested;\n      const gainPct = r.invested > 0 ? (gain / r.invested) * 100 : 0;\n      return {\n        ...r,\n        gainDisplay: Math.abs(gain).toFixed(2),\n        gainPctDisplay: gainPct.toFixed(1),\n        gainSign: gain >= 0 ? '+' : '-',\n        gainColor: gain >= 0 ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)',\n        onNameChange: (e) => this.updateInvestmentField(r.id, 'name', e.target.value),\n        onInvestedChange: (e) => this.updateInvestmentField(r.id, 'invested', e.target.value),\n        onCurrentValueChange: (e) => this.updateInvestmentField(r.id, 'currentValue', e.target.value),\n        onRemove: () => this.removeInvestment(r.id),\n      };\n    });\n    const totalInvested = investmentRows.reduce((a, r) => a + r.invested, 0);\n    const totalCurrentValue = investmentRows.reduce((a, r) => a + r.currentValue, 0);\n    const totalGain = totalCurrentValue - totalInvested;\n    const totalGainPct = totalInvested > 0 ? (totalGain / totalInvested) * 100 : 0;\n\n    return {\n      monthLabel: s.monthLabel,\n      onMonthLabelChange: this.updateMonthLabel,\n      currencySymbol,\n      showSavingsGoals,\n      incomeA, incomeB,\n      totalIncomeADisplay: totalIncomeA.toFixed(2),\n      totalIncomeBDisplay: totalIncomeB.toFixed(2),\n      totalIncomeDisplay: totalIncome.toFixed(2),\n      onAddIncomeA: () => this.addIncome('A'),\n      onAddIncomeB: () => this.addIncome('B'),\n      oneTimeIncome,\n      totalOneTimeDisplay: totalOneTime.toFixed(2),\n      onAddOneTimeIncome: this.addOneTimeIncome,\n      expenseRows,\n      totalExpensesDisplay: totalExpenses.toFixed(2),\n      onAddExpense: this.addExpense,\n      categoryOptions,\n      logForm: {\n        ...s.logForm,\n        paidByIsA: s.logForm.paidBy === 'A',\n        paidByIsB: s.logForm.paidBy === 'B',\n        splitIsSplit: s.logForm.splitRequired,\n        splitIsSolo: !s.logForm.splitRequired,\n      },\n      onLogCategoryChange: this.onLogCategoryChange,\n      onLogDescriptionChange: this.onLogDescriptionChange,\n      onLogAmountChange: this.onLogAmountChange,\n      onPaidByChange: this.onPaidByChange,\n      onSplitChange: this.onSplitChange,\n      onLogSubmit: this.onLogSubmit,\n      logEntries,\n      hasLogEntries: logEntries.length > 0,\n      savingsRows,\n      totalContributionDisplay: totalContribution.toFixed(2),\n      onAddSavings: this.addSavings,\n      remainingDisplay: Math.abs(remaining).toFixed(2),\n      remainingLabel: remaining >= 0 ? 'Left over' : 'Over budget',\n      remainingColor: remaining >= 0 ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)',\n      onExportExcel: this.exportExcel,\n      onResetAll: this.resetAll,\n      onGetCode: this.getSessionCode,\n      onCopyCode: this.copyCode,\n      sessionCode: s.sessionCode,\n      joinCodeInput: s.joinCodeInput,\n      onJoinCodeInputChange: this.onJoinCodeInputChange,\n      onJoinCode: this.joinCode,\n      shareMessage: s.shareMessage || '',\n      tabIsIncome: s.activeTab === 'income',\n      tabIsExpenses: s.activeTab === 'expenses',\n      tabIsSavings: s.activeTab === 'savings',\n      tabIsInvestments: s.activeTab === 'investments',\n      tabIsHistory: s.activeTab === 'history',\n      onTabChange: this.onTabChange,\n      partnerAName: s.partnerAName,\n      partnerBName: s.partnerBName,\n      onPartnerANameChange: this.onPartnerANameChange,\n      onPartnerBNameChange: this.onPartnerBNameChange,\n      partnerAInitial: (s.partnerAName || 'A').trim()[0]?.toUpperCase() || 'A',\n      partnerBInitial: (s.partnerBName || 'B').trim()[0]?.toUpperCase() || 'B',\n      onSaveAndNewMonth: this.saveAndStartNewMonth,\n      savedMonths: s.savedMonths.map(entry => ({\n        ...entry,\n        savedAtDisplay: new Date(entry.savedAt).toLocaleDateString(),\n        totalIncomeDisplay: entry.totalIncome.toFixed(2),\n        totalExpensesDisplay: entry.totalExpenses.toFixed(2),\n        onLoad: () => this.loadSavedMonth(entry.id),\n        onDelete: () => this.deleteSavedMonth(entry.id),\n      })),\n      hasSavedMonths: s.savedMonths.length > 0,\n      hasNoSavedMonths: s.savedMonths.length === 0,\n      investmentRows,\n      onAddInvestment: this.addInvestment,\n      totalInvestedDisplay: totalInvested.toFixed(2),\n      totalGainDisplay: Math.abs(totalGain).toFixed(2),\n      totalGainSign: totalGain >= 0 ? '+' : '-',\n      totalGainPctDisplay: totalGainPct.toFixed(1),\n      totalGainColor: totalGain >= 0 ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
